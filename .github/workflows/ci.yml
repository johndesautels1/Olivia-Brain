name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails if docs/BUILD_TRUTH.{json,md} no longer match the source tree —
      # i.e. someone changed src/ without running `npm run build:truth`. This is
      # the CI-level enforcement of the anti-drift guarantee (no DB needed).
      - name: Build-status truth is current
        run: npm run build:truth -- --check

      - name: Build
        run: npm run build
